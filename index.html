<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App-like: no pinch/double-tap zoom, content extends under the notch, keyboard resizes the view. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>The Happs</title>
    <meta name="description" content="See what's happening around you, right now." />
    <meta name="theme-color" content="#13110f" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Home-screen app (iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Happs" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Launch screens, so opening from the home screen shows the brand instead of a white flash. -->
