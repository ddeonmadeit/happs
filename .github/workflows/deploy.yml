name: Deploy to GitHub Pages

# Builds and publishes the app whenever the default branch changes.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Backend. Defaults to The Happs' own Supabase project; override with
          # repository variables (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://naiwfeihqztoarvvagid.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5haXdmZWlocXp0b2FydnZhZ2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjE1ODIsImV4cCI6MjEwNjMzNzU4Mn0.3w5ibC2Q2-o8NS8rh67BsmzL8KgJcfr0kKLqxv1xJRY' }}
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          # Paid happs. Only switches on with this repo's own backend (see README).
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_live_51T2lz26JRSjqUM0WHgqNXWyfRLduSF7Pa0v6bfTv8JVrKhgLUurh8Z5yMj4Jyayvi5OJ0wetsSHw39iRLsjX4VLd00zfCFwzEU' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
