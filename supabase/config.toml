# Supabase CLI config. Link to your project with:
#   supabase link --project-ref <your-project-ref>
project_id = "the-happs"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]

# These functions return public values or check auth themselves, so they work
# with both legacy anon JWTs and the newer publishable keys.
[functions.get-mapbox-token]
verify_jwt = false

[functions.get-vapid-key]
verify_jwt = false

[functions.send-push]
verify_jwt = false

# Ticketing. They check the signed-in user themselves (the webhook checks
# Stripe's signature; release-payouts checks CRON_SECRET).
[functions.stripe-connect]
verify_jwt = false

[functions.ticket-checkout]
verify_jwt = false

[functions.ticket-refund]
verify_jwt = false

[functions.cancel-happ]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.release-payouts]
verify_jwt = false
